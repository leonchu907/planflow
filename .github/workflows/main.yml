name: PlanFlow CI

on: [push]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.32.8'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Initialize platform folders if missing
        run: |
          [ -d "test" ] && HAD_TEST=1 || HAD_TEST=0
          flutter create --platforms=windows,android .
          if [ "$HAD_TEST" -eq 0 ]; then rm -rf test; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create --platforms=windows,android .
      - name: Configure Android network permissions
        run: |
          python3 -c "import pathlib; q=chr(34); p=pathlib.Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text('utf-8'); perms=f'<uses-permission android:name={q}android.permission.INTERNET{q}/>\n    <uses-permission android:name={q}android.permission.ACCESS_NETWORK_STATE{q}/>\n    '; s=s.replace('<application', perms+'<application', 1) if 'android.permission.INTERNET' not in s else s; s=s.replace('<application', f'<application android:allowBackup={q}false{q} android:usesCleartextTraffic={q}true{q}', 1) if 'android:allowBackup' not in s else s; p.write_text(s, 'utf-8'); print(s)"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PlanFlow-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create --platforms=windows,android .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: PlanFlow-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
