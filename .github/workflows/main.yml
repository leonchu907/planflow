name: PlanFlow CI

on: [push]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.32.8'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Initialize platform folders if missing
        run: |
          [ -d "test" ] && HAD_TEST=1 || HAD_TEST=0
          flutter create --platforms=windows,android .
          if [ "$HAD_TEST" -eq 0 ]; then rm -rf test; fi
      - run: flutter pub get
      - run: flutter analyze

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create --platforms=windows,android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PlanFlow-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create --platforms=windows,android .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: PlanFlow-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
